# ============================================================
# config.cfg — unified parameter config for batch attribute dataset generation
# Read by run_gen_eq_attr_gt.sh / run_gen_range_attr_gt.sh / run_gen_mix_attr_gt.sh.
# Tune parameters here only; no need to edit any .py / .sh.
#
# Format: KEY=VALUE, lines starting with # are comments. Values with spaces need
#   no quotes.
# Precedence: CLI dataset args > environment variables > this file > script defaults.
#   (e.g. `MARGIN=256 bash run_gen_eq_attr_gt.sh` overrides this file for one run)
# Relative paths (LOG_DIR / DATASET_ROOT) are resolved against the script's own
#   directory (this datasets/ folder).
# Config changes are lightly validated (positive integers / ip|l2); typos abort
#   before running.
# ============================================================

# ---------------- Common ----------------
# Python interpreter (needs numpy only; no faiss / GPU). Override via env PY if needed.
PY=python3
# Log directory (master progress + per-dataset logs)
LOG_DIR=./_log
# Dataset root; scripts look up <DATASET_ROOT>/<ds>/<ds>_base.fvecs
DATASET_ROOT=..
# 1 = skip the 256-sample self-check inside the generator (faster, artifacts only)
NO_VERIFY=0

# ---------------- Equality attribute (run_gen_eq_attr_gt.sh) ----------------
# C++ candidate-generation binary name (relative to this folder; env CPP_BIN overrides)
EQ_CPP_BIN=compute_eq_attr_gt
# top-K / random seed / candidate margin M / OpenMP threads (0 = all cores)
EQ_K=100
EQ_SEED=1000
EQ_MARGIN=512
EQ_THREADS=0
# default dataset list (space-separated; CLI dataset args override)
EQ_DATASETS=sift deep1M msmarco openai1536 dbpedia1024 gist msong
# selectivity config: A C pairs, semicolon-separated (sel = 1/C^A)
#   A1_C2 -> 50%   A1_C10 -> 10%   A2_C10 -> 1%   A3_C10 -> 0.1%   A10_C2 -> 0.098%
EQ_CONFIGS=1 2;1 10;2 10;3 10;10 2
# metric map: ds=metric space-separated (default l2 if absent; msmarco measured as L2)
EQ_METRICS=sift=l2 deep1M=l2 msmarco=l2 gist=l2 msong=l2 openai1536=ip dbpedia1024=ip

# ---------------- Range attribute (run_gen_range_attr_gt.sh) ----------------
# C++ candidate-generation binary name (relative to this folder; env CPP_BIN overrides)
RANGE_CPP_BIN=compute_range_attr_gt
# top-K / random seed / candidate margin M / OpenMP threads (0 = all cores)
RANGE_K=100
RANGE_SEED=1000
RANGE_MARGIN=512
RANGE_THREADS=0
# default dataset list (space-separated; CLI dataset args override)
RANGE_DATASETS=sift msmarco openai1536
# range selectivity config: A C w triples, semicolon-separated (sel = (w/C)^A)
#   A1 C100 w50 -> 50%    A1 C100 w10 -> 10%
#   A2 C100 w10 -> 1%     A3 C100 w10 -> 0.1%
RANGE_CONFIGS=1 100 50;1 100 10;2 100 10;3 100 10
# metric map: ds=metric space-separated (default l2 if absent; msmarco measured as L2)
RANGE_METRICS=sift=l2 msmarco=l2 openai1536=ip

# ---------------- Mixed attribute (1 equality + 1 range, run_gen_mix_attr_gt.sh) ----------------
# Each vector carries one equality attribute + one range attribute; the filter is a
#   two-condition AND:
#   base equality attribute == query equality value  AND  base range attribute in [lo, hi]
# C++ candidate-generation binary name (relative to this folder; env CPP_BIN overrides)
MIX_CPP_BIN=compute_mix_attr_gt
# top-K / random seed / candidate margin M / OpenMP threads (0 = all cores)
MIX_K=100
MIX_SEED=1000
MIX_MARGIN=512
MIX_THREADS=0
# equality cardinality C_eq -> 1/C_eq; range cardinality C_range + width w -> w/C_range
# selectivity sel = (1/C_eq) * (w / C_range); default 1/10 * 10/100 = 1%
MIX_C_EQ=10
MIX_C_RANGE=100
MIX_W=10
# default dataset list (space-separated; CLI dataset args override)
MIX_DATASETS=sift deep1M msmarco openai1536 dbpedia1024 gist msong
# metric map: ds=metric space-separated (default l2 if absent; msmarco measured as L2)
MIX_METRICS=sift=l2 deep1M=l2 msmarco=l2 gist=l2 msong=l2 openai1536=ip dbpedia1024=ip
